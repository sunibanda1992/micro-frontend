<div class="container mt-4">
  <ul ngbNav #nav="ngbNav" [(activeId)]="activeTab" class="nav-tabs">
    <li [ngbNavItem]="'client'">
      <button ngbNavLink (click)="navigateToTab('client')">Client</button>
    </li>
    <li [ngbNavItem]="'vehicle'">
      <button ngbNavLink (click)="navigateToTab('vehicle')">Vehicle</button>
    </li>
    <li [ngbNavItem]="'driver'">
      <button ngbNavLink (click)="navigateToTab('driver')">Driver</button>
    </li>
    <li [ngbNavItem]="'registration'">
      <button ngbNavLink (click)="navigateToTab('registration')">Registration</button>
    </li>
  </ul>

  <div class="mt-3">
    <router-outlet></router-outlet>
  </div>
</div>
